<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${moto.idMoto == null} ? 'Nova Moto' : 'Editar Moto'"></title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
          rel="stylesheet" 
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
          crossorigin="anonymous">

    <link th:href="@{/css/mottu-styles.css}" rel="stylesheet" />
</head>

<body>

    <div th:replace="~{fragments :: header}"></div>

    <div class="container mt-4">
        
        <h1 class="h2 mb-4" th:text="${moto.idMoto == null} ? 'Nova Moto' : 'Editar Moto'"></h1>

        <form th:action="@{/motos}" th:object="${moto}" method="post">
            <input type="hidden" th:field="*{idMoto}" />
            
            <div class="mb-3">
                <label for="modelo" class="form-label">Modelo:</label>
                <input type="text" id="modelo" class="form-control" th:field="*{modelo}" />
            </div>
            
            <div class="mb-3">
                <label for="placa" class="form-label">Placa:</label>
                <input type="text" id="placa" class="form-control" th:field="*{placa}" />
            </div>

            <div class="mb-3">
                <label for="patio" class="form-label">Pátio:</label>
                <select id="patio" class="form-select" th:field="*{patio.idPatio}">
                    <option value="">Selecione um pátio</option>
                    
                    <option th:each="p : ${patios}" 
                            th:value="${p.idPatio}" 
                            th:text="${p.localizacao}"></option>
                </select>
            </div>

            <div>
                <button type="submit" class="btn btn-mottu-green">Salvar</button>
                <a th:href="@{/motos}" class="btn btn-secondary">Voltar</a>
            </div>
        </form>

    </div>

    <div class="container">
      <div th:replace="~{fragments :: footer}"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" 
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" 
            crossorigin="anonymous"></script>

</body>
</html>
