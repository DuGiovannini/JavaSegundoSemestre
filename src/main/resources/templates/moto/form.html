<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Cadastro de Moto</title>
</head>
<body>
<div th:replace="fragments :: header"></div>

<h1 th:text="${moto.id == null} ? 'Nova Moto' : 'Editar Moto'"></h1>

<form th:action="@{/motos}" th:object="${moto}" method="post">
    <input type="hidden" th:field="*{id}" />

    <label>Modelo:</label>
    <input type="text" th:field="*{modelo}" /><br/>

    <label>Placa:</label>
    <input type="text" th:field="*{placa}" /><br/>

    <label>Pátio:</label>
    <select th:field="*{patio}">
        <option th:each="p : ${patios}" 
                th:value="${p.idPatio}" 
                th:text="${p.localizacao}">
        </option>
    </select><br/>

    <button type="submit">Salvar</button>
</form>

<a th:href="@{/motos}">Voltar</a>

<div th:replace="fragments :: footer"></div>
</body>
</html>
