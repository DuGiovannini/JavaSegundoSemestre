<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head>
    <meta charset="UTF-8">
    <title>Lista de Motos</title>
</head>
<body>
<div th:replace="fragments :: header"></div>

<h2>Lista de Motos</h2>

<a th:href="@{/motos/novo}">+ Nova Moto</a>

<table border="1" cellpadding="5">
    <tr>
        <th>ID</th>
        <th>Modelo</th>
        <th>Placa</th>
        <th>Pátio</th>
        <th>Ações</th>
    </tr>
    <tr th:each="m : ${motos}">
        <td th:text="${m.id}"></td>
        <td th:text="${m.modelo}"></td>
        <td th:text="${m.placa}"></td>
        <td th:text="${m.patio.localizacao}"></td>
        <td>
            <a th:href="@{'/motos/' + ${m.id} + '/editar'}">Editar</a>
            
            <span sec:authorize="hasRole('ADMIN')">
                | <a th:href="@{'/motos/' + ${m.id} + '/excluir'}">Excluir</a>
            </span>
        </td>
    </tr>
</table>

<div th:replace="fragments :: footer"></div>
</body>
</html>
