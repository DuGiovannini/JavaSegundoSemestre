<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Motos - Gestão Mottu</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
          rel="stylesheet" 
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
          crossorigin="anonymous">

    <link th:href="@{/css/mottu-styles.css}" rel="stylesheet" />
</head>

<body>

    <div th:replace="~{fragments :: header}"></div>

    <div class="container mt-4">
        
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="h2">Lista de Motos</h1>
            
            <a th:href="@{/motos/novo}" class="btn btn-mottu-green">+ Nova Moto</a>
        </div>
        
    <table class="table table-striped table-hover align-middle">
                <thead class="table-dark"> <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Modelo</th>
                        <th scope="col">Placa</th>
                        <th scope="col">Pátio</th>
                        <th scope="col" style="width: 100px;">Ações</th>
                    </tr>
                </thead>
        <tr>
            <th>ID</th>
            <th>Modelo</th>
            <th>Placa</th>
            <th>Pátio</th>
            <th>Ações</th>
        </tr>
        <tr th:each="m : ${motos}">
            <td th:text="${m.idMoto}"></td>
            <td th:text="${m.modelo}"></td>
            <td th:text="${m.placa}"></td>
            <td th:text="${m.patio.localizacao}"></td>
            <td>
                <a th:href="@{'/motos/' + ${m.idMoto} + '/editar'}">Editar</a>
                
                <span sec:authorize="hasRole('ADMIN')">
                    | <a th:href="@{'/motos/' + ${m.idMoto} + '/excluir'}">Excluir</a>
                </span>
            </td>
        </tr>
    </table>

    </div>

    <div class="container">
      <div th:replace="~{fragments :: footer}"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" 
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" 
            crossorigin="anonymous"></script>

</body>
</html>
