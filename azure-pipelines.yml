# azure-pipelines.yml

trigger:
  branches:
    include:
      - main # Dispara a cada alteração no branch master (Regra II)

variables:
  # PREENCHA ESTAS 3 VARIÁVEIS COM SEUS NOMES REAIS:
  azureServiceConnection: 'azure-sprint4' 
  acrName: 'meuregistrysprint4' 
  appName: 'sprint4' 
  group: ACR-Secrets
  #----------------------------------------------------
  
  imageRepository: 'java-app' 
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)' 
  vmImage: 'ubuntu-latest' 

stages:
- stage: CI_Build
  displayName: 'CI - Build, Testes e Docker'
  jobs:
  - job: BuildAndPush
    displayName: 'Compilar e Publicar Imagem'
    pool:
      vmImage: $(vmImage)
    steps:
    
    # 1. Build da Aplicação Java (Maven)
    - task: Maven@3
      displayName: 'Rodar Build e Testes Automáticos' 
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'package'
        jdkVersionOption: '21'

# 2. Construção da Imagem Docker (Não precisa de login para construir)
    - task: Docker@2
      displayName: 'Construir Imagem Docker'
      inputs:
        command: 'build'
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        tags: |
          $(tag)
          latest

# 3. Push Imagem para o ACR (Autenticação Explícita: Usuário/Senha)
    - task: Docker@2
      displayName: 'Push Imagem para o ACR'
      inputs:
        command: 'push'
        # O campo 'containerRegistry' deve ser o URL do seu ACR
        containerRegistry: '$(acrName).azurecr.io' 
        # Força o login com as credenciais secretas:
        username: '$(ACR_USER)' # <--- VARIÁVEL SECRETA
        password: '$(ACR_PASS)' # <--- VARIÁVEL SECRETA
        repository: $(imageRepository)
        tags: |
          $(tag)
          latest

    # 4. Push da Imagem para o ACR (Task Docker@2 - Push)
    - task: Docker@2
      displayName: 'Push Imagem para o ACR'
      inputs:
        command: 'push'
        repository: $(imageRepository)
        tags: |
          $(tag)
          latest

- stage: CD_Deploy
  displayName: 'CD - Deploy no Azure'
  dependsOn: CI_Build 
  condition: succeeded()
  jobs:
  - job: Deploy
    displayName: 'Deploy Automático no Azure Web App' # CD: deploy automático (Regra 7.b)
    pool:
      vmImage: $(vmImage)
    steps:
    
    # 1. Deploy no Azure Web App (Regra VII)
    - task: AzureRmWebAppDeployment@4
      displayName: 'Deploy para Azure Web App'
      inputs:
        azureSubscription: $(azureServiceConnection)
        WebAppName: $(appName)
        appType: 'webAppContainer' 
        # Especifica a imagem no ACR que será usada para o deploy
        imageName: '$(acrName).azurecr.io/$(imageRepository):$(tag)'