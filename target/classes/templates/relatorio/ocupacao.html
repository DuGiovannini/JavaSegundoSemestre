<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Relatório de Ocupação</title>
</head>
<body>
<div th:replace="~{fragments :: header}"></div>

<h2>Relatório de Ocupação de Pátios</h2>

<table border="1" cellpadding="5">
    <thead>
        <tr>
            <th>Localização do Pátio</th>
            <th>Ocupação (Motos / Capacidade)</th>
        </tr>
    </thead>
    <tbody>
        <tr th:if="${#lists.isEmpty(relatorio)}">
            <td colspan="2">Nenhum pátio encontrado.</td>
        </tr>
        <tr th:each="item : ${relatorio}">
            <td th:text="${item.localizacao}">Pátio Central</td>
            <td th:text="${item.motosAtuais + ' / ' + item.capacidade}">15 / 50</td>
        </tr>
    </tbody>
</table>
<br/>
<a th:href="@{/}">Voltar para Home</a>

<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
