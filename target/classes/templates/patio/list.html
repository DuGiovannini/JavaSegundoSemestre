<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Pátios</title>
</head>
<body>
<div th:replace="fragments :: header"></div>

<h2>Lista de Pátios</h2>

<a th:href="@{/patios/novo}">+ Novo Pátio</a>

<table border="1" cellpadding="5">
    <tr>
        <th>ID</th>
        <th>Localização</th>
        <th>Capacidade</th>
        <th>Ações</th>
    </tr>
    <tr th:each="p : ${patios}">
    <td th:text="${p.idPatio}"></td>
    <td th:text="${p.localizacao}"></td>
    <td th:text="${p.capacidade}"></td>
    <td>
        <a th:href="@{'/patios/' + ${p.idPatio} + '/editar'}">Editar</a> |
        <a th:href="@{'/patios/' + ${p.idPatio} + '/excluir'}">Excluir</a>
    </td>
</tr>
</table>

<div th:replace="fragments :: footer"></div>
</body>
</html>
