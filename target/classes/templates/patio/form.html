<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${patio.idPatio == null} ? 'Novo Pátio' : 'Editar Pátio'"></title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
          rel="stylesheet" 
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
          crossorigin="anonymous">

    <link th:href="@{/css/mottu-styles.css}" rel="stylesheet" />
</head>

<body>

    <div th:replace="~{fragments :: header}"></div>

    <div class="container mt-4">
        
        <h1 class="h2 mb-4" th:text="${patio.idPatio == null} ? 'Novo Pátio' : 'Editar Pátio'"></h1>

        <form th:action="@{/patios}" th:object="${patio}" method="post">
            <input type="hidden" th:field="*{idPatio}" />
            
            <div class="mb-3">
                <label for="localizacao" class="form-label">Localização:</label>
                <input type="text" id="localizacao" class="form-control" th:field="*{localizacao}" />
            </div>
            
            <div class="mb-3">
                <label for="capacidade" class="form-label">Capacidade:</label>
                <input type="number" id="capacidade" class="form-control" th:field="*{capacidade}" />
            </div>

            <div>
                <button type="submit" class="btn btn-mottu-green">Salvar</button>
                
                <a th:href="@{/patios}" class="btn btn-secondary">Voltar</a>
            </div>
        </form>

    </div>

    <div class="container">
      <div th:replace="~{fragments :: footer}"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" 
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" 
            crossorigin="anonymous"></script>

</body>
</html>
